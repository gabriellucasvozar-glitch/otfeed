name: Update news

on:
  schedule:
    # Every 5 minutes (GitHub's shortest interval; runs can start a few minutes late when GitHub is busy)
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect and score news
        env:
          # Optional: add this repository secret to get AI-written summaries and priority checks.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/collect.py
      - name: Commit updated data
        run: |
          if git diff --quiet -- data/news.json; then
            echo "No new stories."
            exit 0
          fi
          git config user.name "ot-feed-bot"
          git config user.email "ot-feed-bot@users.noreply.github.com"
          git add data/news.json
          git commit -m "Update news $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash origin main
          git push
